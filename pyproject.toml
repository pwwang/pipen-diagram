[project]
name = "pipen-diagram"
dynamic = ["version"]
description = "Draw pipeline diagrams for pipen."
authors = [{name = "pwwang", email = "pwwang@pwwang.com"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9,<4.0"
dependencies = [
    # Lower bound includes the prerelease marker (1.1.0rc0) so uv's default
    # prerelease policy (`if-necessary-or-explicit`) still considers pipen
    # pre-releases, matching poetry's `1.1.*` + `allow-prereleases = true`.
    "pipen>=1.1",
    "graphviz>=0.21",
]

[tool.hatch.version]
path = "pipen_diagram/__init__.py"

[project.urls]
Homepage = "https://github.com/pwwang/pipen-diagram"
Repository = "https://github.com/pwwang/pipen-diagram"

[project.entry-points.pipen]
diagram = "pipen_diagram:PipenDiagram"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=6,<7",
    "pytest-xdist>=3,<4",
    "pytest-forked>=1,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-vv -n auto -W error::UserWarning -p no:asyncio --cov-config=.coveragerc --cov=pipen_diagram --cov-report xml:.coverage.xml --cov-report term-missing"
console_output_style = "progress"
junit_family = "xunit1"
filterwarnings = [
    "ignore:.+may lead to deadlocks in the child:DeprecationWarning",
]

[tool.mypy]
ignore_missing_imports = true
allow_redefinition = true
disable_error_code = ["attr-defined", "no-redef"]
show_error_codes = true
strict_optional = false

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = ["tests/"]

# Same as Black.
line-length = 88
indent-width = 4

[tool.uv]
prerelease = "allow"
